[project]
name = "rl-hello-world"
version = "0.1.0"
description = "Reinforcement Learning Hello World Examples"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
]
