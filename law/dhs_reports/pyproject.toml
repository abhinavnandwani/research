[project]
name = "dhs-overstay-analysis"
version = "0.1.0"
description = "Analysis of DHS student visa overstay data for India"
requires-python = ">=3.8"
dependencies = [
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
